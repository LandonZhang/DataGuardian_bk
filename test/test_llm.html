<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM聊天接口测试</title>
    <style>
      body {
        font-family: "Microsoft YaHei", Arial, sans-serif;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f5f5f5;
      }
      h1 {
        color: #333;
        text-align: center;
        margin-bottom: 20px;
      }
      .chat-container {
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: white;
        height: 400px;
        overflow-y: auto;
        padding: 15px;
        margin-bottom: 20px;
        transition: all 0.3s ease;
      }
      .message {
        margin-bottom: 15px;
        padding: 10px;
        border-radius: 5px;
        max-width: 80%;
      }
      .user-message {
        background-color: #e3f2fd;
        margin-left: auto;
        text-align: right;
      }
      .bot-message {
        background-color: #f1f1f1;
        margin-right: auto;
      }
      .input-container {
        display: flex;
        margin-bottom: 20px;
      }
      #user-input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 16px;
      }
      button {
        padding: 10px 15px;
        margin-left: 10px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background-color: #45a049;
      }
      .reset-button {
        background-color: #f44336;
      }
      .reset-button:hover {
        background-color: #d32f2f;
      }
      .system-message {
        text-align: center;
        color: #757575;
        margin: 10px 0;
        font-style: italic;
      }
      .loading {
        text-align: center;
        margin: 10px 0;
      }
      .loading::after {
        content: "...";
        animation: dots 1.5s steps(5, end) infinite;
      }
      @keyframes dots {
        0%,
        20% {
          content: ".";
        }
        40% {
          content: "..";
        }
        60%,
        100% {
          content: "...";
        }
      }
    </style>
  </head>
  <body>
    <h1>LLM聊天接口测试</h1>

    <div class="chat-container" id="chat-container">
      <div class="system-message">聊天已开始，请输入您的问题</div>
    </div>

    <div class="input-container">
      <input
        type="text"
        id="user-input"
        placeholder="请输入您的问题..."
        autofocus
      />
      <button id="send-button">发送</button>
      <button id="reset-button" class="reset-button">重置对话</button>
    </div>

    <div>
      <h3>接口状态</h3>
      <pre id="api-status">尚未发送请求</pre>
    </div>

    <script>
      // DOM元素
      const chatContainer = document.getElementById("chat-container");
      const userInput = document.getElementById("user-input");
      const sendButton = document.getElementById("send-button");
      const resetButton = document.getElementById("reset-button");
      const apiStatus = document.getElementById("api-status");

      // 固定用户ID
      const userId = "root";

      // 添加消息到聊天容器
      function addMessage(content, isUser = false) {
        const messageDiv = document.createElement("div");
        messageDiv.className = isUser
          ? "message user-message"
          : "message bot-message";
        messageDiv.textContent = content;
        chatContainer.appendChild(messageDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      // 添加系统消息
      function addSystemMessage(content) {
        const messageDiv = document.createElement("div");
        messageDiv.className = "system-message";
        messageDiv.textContent = content;
        chatContainer.appendChild(messageDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      // 添加加载中消息
      function addLoadingMessage() {
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "loading";
        loadingDiv.id = "loading-message";
        loadingDiv.textContent = "正在思考";
        chatContainer.appendChild(loadingDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      // 移除加载中消息
      function removeLoadingMessage() {
        const loadingMessage = document.getElementById("loading-message");
        if (loadingMessage) {
          loadingMessage.remove();
        }
      }

      // 发送消息到API
      async function sendMessage(userMessage) {
        // 显示用户消息
        addMessage(userMessage, true);

        // 显示加载中
        addLoadingMessage();

        try {
          // 准备请求数据
          const requestData = {
            query: userMessage,
            user: userId,
          };

          // 更新API状态
          apiStatus.textContent = `发送请求: ${JSON.stringify(
            requestData,
            null,
            2
          )}`;

          // 发送API请求
          const response = await fetch("http://127.0.0.1:8080/llm/chat/", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(requestData),
          });

          // 检查响应状态
          if (!response.ok) {
            throw new Error(
              `API请求失败: ${response.status} ${response.statusText}`
            );
          }

          // 解析响应
          const data = await response.json();

          // 更新API状态
          apiStatus.textContent = `接收响应: ${JSON.stringify(data, null, 2)}`;

          // 移除加载中消息
          removeLoadingMessage();

          // 显示机器人回复
          addMessage(data.answer);
        } catch (error) {
          // 移除加载中消息
          removeLoadingMessage();

          // 显示错误消息
          addSystemMessage(`发生错误: ${error.message}`);
          apiStatus.textContent = `错误: ${error.message}`;
          console.error("发送消息时出错:", error);
        }
      }

      // 重置对话
      async function resetConversation() {
        try {
          // 添加过渡效果
          chatContainer.style.opacity = "0.5";

          const response = await fetch(
            "http://127.0.0.1:8080/llm/chat/new-conversation",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ user: userId }),
            }
          );

          if (!response.ok) {
            throw new Error(
              `重置对话失败: ${response.status} ${response.statusText}`
            );
          }

          // 清空聊天容器
          chatContainer.innerHTML = "";

          // 重置API状态
          apiStatus.textContent = "对话已重置，开始新对话";

          // 添加欢迎消息
          addSystemMessage("对话已重置，请开始新的对话");

          // 恢复透明度
          chatContainer.style.opacity = "1";

          // 重置输入框
          userInput.value = "";
          userInput.focus();
        } catch (error) {
          // 恢复透明度
          chatContainer.style.opacity = "1";

          addSystemMessage(`重置对话出错: ${error.message}`);
          apiStatus.textContent = `重置错误: ${error.message}`;
          console.error("重置对话时出错:", error);
        }
      }

      // 发送按钮点击事件
      sendButton.addEventListener("click", () => {
        const message = userInput.value.trim();
        if (message) {
          sendMessage(message);
          userInput.value = "";
        }
      });

      // 输入框回车事件
      userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          const message = userInput.value.trim();
          if (message) {
            sendMessage(message);
            userInput.value = "";
          }
        }
      });

      // 重置按钮点击事件
      resetButton.addEventListener("click", resetConversation);

      // 欢迎消息
      addSystemMessage("欢迎使用LLM聊天测试页面，请输入您的问题");
    </script>
  </body>
</html>
